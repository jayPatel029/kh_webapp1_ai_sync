name: Sync Alerts Branch to Public AI Repository

on:
  push:
    branches:
      - fix/alerts-workflow-stabilization
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PUBLIC_REPO_SYNC_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Sync alerts branch
        run: |
          git remote add public git@github.com:jayPatel029/kh_webapp1_ai_sync.git
          git push public HEAD:refs/heads/fix/alerts-workflow-stabilization --force