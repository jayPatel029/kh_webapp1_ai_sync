<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="salineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="12" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Title Banner -->
  <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e293b">HEMODIALYSIS BLOOD RETURN &amp; RINSE-BACK PROTOCOL (P4-01)</text>

  <!-- Flow Diagrams / Components -->
  <g transform="translate(24, 48)">
    <!-- Saline Rinse Bag -->
    <g transform="translate(20, 10)">
      <rect x="10" y="0" width="36" height="50" rx="6" fill="url(#salineGrad)" opacity="0.85" filter="url(#shadow)"/>
      <rect x="22" y="-6" width="12" height="6" rx="2" fill="#0284c7"/>
      <text x="28" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">0.9%</text>
      <text x="28" y="38" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff">NaCl</text>
      <path d="M 28 50 L 28 80" stroke="#0284c7" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
      <text x="28" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0369a1">Saline 200mL</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 90 60 L 130 60" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- Blood Pump (Step 2: 100 mL/min) -->
    <g transform="translate(140, 10)">
      <circle cx="40" cy="40" r="32" fill="#ffffff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="40" cy="40" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M 40 25 L 40 40 L 50 45" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="40" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e40af">Blood Pump</text>
      <text x="40" y="102" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3b82f6">100 mL/min</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 230 60 L 270 60" stroke="#ef4444" stroke-width="3" fill="none"/>

    <!-- Dialyzer Filter (Step 3 & 4) -->
    <g transform="translate(280, 5)">
      <rect x="0" y="0" width="50" height="95" rx="8" fill="url(#cardGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
      <!-- Inner fibers -->
      <line x1="12" y1="10" x2="12" y2="85" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="20" y1="10" x2="20" y2="85" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="28" y1="10" x2="28" y2="85" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="36" y1="10" x2="36" y2="85" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="25" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155">Dialyzer</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 345 60 L 385 60" stroke="#dc2626" stroke-width="3.5" fill="none"/>

    <!-- Venous Line & Line Clamp (Step 5 & 6) -->
    <g transform="translate(395, 15)">
      <rect x="10" y="15" width="24" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <!-- Clamp graphic -->
      <rect x="6" y="30" width="32" height="10" rx="2" fill="#991b1b"/>
      <text x="22" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#991b1b">Line Clamp</text>
    </g>

    <!-- Arrow 4 to Patient Access -->
    <path d="M 445 60 L 490 60" stroke="#b91c1c" stroke-width="3" fill="none"/>

    <!-- Patient Access (AVF / CVC - Step 7) -->
    <g transform="translate(500, 10)">
      <rect x="0" y="0" width="100" height="85" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
      <path d="M 20 42 Q 50 20 80 42" stroke="#059669" stroke-width="3" fill="none"/>
      <circle cx="50" cy="33" r="5" fill="#10b981"/>
      <text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">Patient Access</text>
      <text x="50" y="75" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#059669">AVF / CVC Line</text>
    </g>

    <!-- Step Summary Badge Grid below -->
    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="750" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">1. Stop UF</text>
      <text x="95" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb">2. Pump 100mL/min</text>
      <text x="220" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7">3. Rinse-Back (200mL)</text>
      <text x="375" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">4. Return Blood</text>
      <text x="480" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">5. Clamp Lines</text>
      <text x="580" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">6. Stop Pump</text>
      <text x="670" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">7. Disconnect</text>
    </g>
  </g>
</svg>
